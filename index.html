<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- DNS Prefetch and Preconnect for Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&family=Syne:wght@700;800&display=swap"
    />
    <!-- OLD CODE (commented by AI)
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://images.pexels.com" />
    <link rel="preload" as="image" href="/images/hero_workout.jpg" fetchpriority="high" />
    -->
    <!-- NEW CODE - performance optimization: Remove unused 3rd-party origins, preload WebP hero, add theme-color -->
    <meta name="theme-color" content="#0E1420" />
    <link
      rel="preload"
      as="image"
      href="/images/hero_workout-480w.webp"
      imagesrcset="/images/hero_workout-480w.webp 480w, /images/hero_workout-768w.webp 768w, /images/hero_workout.webp 1024w"
      imagesizes="100vw"
      type="image/webp"
      fetchpriority="high"
    />
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <noscript>
      <style>
        .reveal-item { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>
    
    <!-- Default Fallback Meta Tags -->
    <title>Wellwigen | Online Personal Training &amp; Group Fitness - Stronger Body. Better You.</title>
    <meta name="description" content="Get Fit. Get Strong. Stay Consistent. Personalized 1-on-1 online personal training and live group fitness classes with expert coaches. Train from anywhere with Wellwigen." />
    <meta name="keywords" content="online personal training, live group fitness, fitness coach India, online workout classes, HIIT, Tabata, Yoga, Jungle Fit, strength training, weight loss personal trainer" />
    <meta name="author" content="Wellwigen" />
    
    <!-- Robots configuration -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  </head>
  <body style="background-color: #0E1420; margin: 0; padding: 0;">
    <!-- OLD CODE (commented by AI)
    <div id="root"></div>
    -->
    <!-- NEW CODE - performance optimization: instant-visible lightweight critical shell while JS loads -->
    <div id="root" style="background-color: #0E1420; min-height: 100vh;">
      <div id="critical-shell" style="background-color: #0E1420; min-height: 100vh; color: #ffffff; font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; padding: 18px 20px; box-sizing: border-box; overflow: hidden;">
        <!-- Header Shell -->
        <header style="display: flex; justify-content: space-between; align-items: center; max-width: 1280px; margin: 0 auto; height: 56px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 24px; font-weight: 900; letter-spacing: -0.5px; color: #ffffff;">WELLWIGEN<span style="color: #2DE2C8;">.</span></span>
          </div>
          <div style="display: flex; align-items: center; gap: 12px;">
            <div style="width: 80px; height: 32px; border-radius: 9999px; background: rgba(31, 181, 163, 0.2); border: 1px solid rgba(45, 226, 200, 0.4);"></div>
          </div>
        </header>

        <!-- Hero Skeleton Shell -->
        <main style="max-width: 1280px; margin: 36px auto 0; padding: 0 4px;">
          <div style="display: inline-block; padding: 6px 14px; border-radius: 9999px; background: rgba(31, 181, 163, 0.12); border: 1px solid rgba(45, 226, 200, 0.3); color: #2DE2C8; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; margin-bottom: 20px; text-transform: uppercase;">
            Virtual Fitness Elevated
          </div>
          <h1 style="font-size: clamp(34px, 7vw, 68px); font-weight: 900; line-height: 1.08; letter-spacing: -0.02em; margin: 0 0 16px 0; color: #ffffff;">
            TRANSFORM<br />
            YOUR BODY<br />
            <span style="color: #94a3b8;">WITH</span> <span style="color: #2DE2C8;">PERSONAL TRAINING</span>
          </h1>
          <p style="font-size: 15px; line-height: 1.5; color: #94a3b8; max-width: 480px; margin: 0 0 24px 0;">
            Elite 1-on-1 virtual personal coaching and dynamic group classes designed for measurable, sustainable results.
          </p>
          <div style="display: flex; gap: 12px; flex-wrap: wrap;">
            <div style="height: 48px; width: 170px; border-radius: 12px; background: linear-gradient(135deg, #1FB5A3, #2DE2C8);"></div>
            <div style="height: 48px; width: 150px; border-radius: 12px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);"></div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
