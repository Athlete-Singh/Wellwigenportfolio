<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- DNS Prefetch and Preconnect for Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&family=Syne:wght@700;800&display=swap"
    />
    <!-- OLD CODE (commented by AI)
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://images.pexels.com" />
    <link rel="preload" as="image" href="/images/hero_workout.jpg" fetchpriority="high" />
    -->
    <!-- NEW CODE - performance optimization: Remove unused 3rd-party origins, preload WebP hero, add theme-color -->
    <meta name="theme-color" content="#0E1420" />
    <link
      rel="preload"
      as="image"
      href="/images/hero_workout-480w.webp"
      imagesrcset="/images/hero_workout-480w.webp 480w, /images/hero_workout-768w.webp 768w, /images/hero_workout.webp 1024w"
      imagesizes="100vw"
      type="image/webp"
      fetchpriority="high"
    />
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <noscript>
      <style>
        .reveal-item { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>
    
    <!-- Default Fallback Meta Tags -->
    <title>Wellwigen | Online Personal Training &amp; Group Fitness - Stronger Body. Better You.</title>
    <meta name="description" content="Get Fit. Get Strong. Stay Consistent. Personalized 1-on-1 online personal training and live group fitness classes with expert coaches. Train from anywhere with Wellwigen." />
    <meta name="keywords" content="online personal training, live group fitness, fitness coach India, online workout classes, HIIT, Tabata, Yoga, Jungle Fit, strength training, weight loss personal trainer" />
    <meta name="author" content="Wellwigen" />
    
    <!-- Robots configuration -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  </head>
  <body style="background-color: #0E1420; margin: 0; padding: 0;">
    <div id="root" style="background-color: #0E1420; min-height: 100vh;"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
